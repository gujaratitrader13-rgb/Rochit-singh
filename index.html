<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rochit Singh Stocks - Community Link</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0c0e15; /* Matching dark background */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px; /* Side padding for mobile */
        }

        .card-container {
            width: 100%;
            max-width: 375px; /* Maximum width on phone */
            background-color: #12161e; /* Darker card shade */
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #1a202c; /* Subtly defined border */
            overflow: hidden;
            position: relative;
        }

        /* Profile image alignment - centered with slight upward float on hover/active */
        .profile-img-container {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            border: 2.5px solid #2d3748; /* Ring border */
            margin-bottom: 18px;
            overflow: hidden;
            background-color: #1a202c;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Placeholder for profile image - user must change this src */
            transition: transform 0.3s ease;
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Center category badge */
        .category-badge {
            background-color: #1a2318;
            color: #22c55e;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 15px;
            border: 1px solid #22c55e33;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Title text - correct color/placement */
        .main-title {
            font-size: 24px;
            font-weight: 800;
            color: #f7fafc; /* Lighter than white */
            letter-spacing: 1px;
            line-height: 1.2;
            margin-bottom: 22px;
            white-space: nowrap; /* Prevents text from breaking */
        }

        .main-title span {
            color: #fbbf24; /* Title text highlight */
        }

        /* List items - perfectly centered text */
        .features-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
            width: 100%;
        }

        .feature-item {
            font-size: 13px;
            color: #e2e8f0; /* Lighter white for text */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            text-align: left;
            width: fit-content;
            margin: 0 auto;
        }

        /* Stats container */
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 18px;
            width: 100%;
            margin-bottom: 32px;
        }

        .stat-box {
            background-color: #161b22;
            padding: 12px 20px;
            border-radius: 12px;
            flex: 1; /* Equal width distribution */
            border: 1px solid #2d3748;
        }

        .stat-number {
            font-size: 16px;
            font-weight: bold;
            color: #f6ad55; /* Warm gold for stats */
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 11px;
            color: #cbd5e1;
        }

        /* Glowing Join Telegram Button */
        .join-btn {
            width: 100%;
            background: linear-gradient(135deg, #fbb03b 0%, #ec9a1e 100%); /* Telegram yellow */
            color: #12161e;
            font-size: 16px;
            font-weight: 700;
            padding: 16px 20px;
            border-radius: 35px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(246, 173, 85, 0.2);
            /* Glowing animation setup */
            animation: pulseGlow 1.8s infinite ease-in-out;
            transition: background 0.3s;
        }

        /* Glowing animation keyframes */
        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 10px rgba(246, 173, 85, 0.3);
            }
            50% {
                box-shadow: 0 0 25px rgba(246, 173, 85, 0.7);
            }
            100% {
                box-shadow: 0 0 10px rgba(246, 173, 85, 0.3);
            }
        }

        /* Background light beam animation */
        .join-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to right,
                transparent 0%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 100%
            );
            animation: shine 3s infinite linear;
        }

        @keyframes shine {
            to {
                left: 100%;
            }
        }

        /* Subtitle texts */
        .footer-text {
            font-size: 11px;
            color: #718096;
            margin-bottom: 6px;
        }

        .credits {
            font-size: 11px;
            color: #718096;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        
        <!-- Profile Image - Update src with actual photo URL -->
        <div class="profile-img-container">
            <img src="https://via.placeholder.com/100" alt="Rochit Singh">
        </div>

        <!-- Category -->
        <div class="category-badge">
            📊 STOCK MARKET COMMUNITY
        </div>

        <!-- Title -->
        <h1 class="main-title">
            👑 ROCHIT SINGH STOCKS
        </h1>

        <!-- List Items -->
        <div class="features-list">
            <div class="feature-item">📊 NIFTY & BANKNIFTY Analysis</div>
            <div class="feature-item">🎯 Price Action Learning</div>
            <div class="feature-item">📈 Stock Market Education</div>
            <div class="feature-item">🛡️ Risk Management Concepts</div>
        </div>

        <!-- Stats Boxes -->
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-number">26K+</div>
                <div class="stat-label">Members</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">Daily</div>
                <div class="stat-label">Updates</div>
            </div>
        </div>

        <!-- Glowing Join Button -->
        <a href="#" class="join-btn">
            🚀 Join Telegram Community
        </a>

        <!-- Footer Text -->
        <div class="footer-text">
            Free Access • Educational Content • Beginner Friendly
        </div>
        <div class="credits">
            🚀 Ads Managed By Digital Growth Zone
        </div>

    </div>

</body>
</html>
